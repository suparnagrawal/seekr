services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seekr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d seekr" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend / Worker
  #
  # The backend is run separately (e.g. `uvicorn backend.fabric_api.main:app`)
  # rather than as a Docker service in this compose file.  When running locally
  # or for demo / hackathon-judge use, set the following environment variables
  # (or create backend/.env from backend/.env.example):
  #
  #   ENVIRONMENT=local          # disables JWT auth by default
  #   LLM_API_KEY=<your-key>     # required for LLM calls
  #
  # For production with real auth, leave ENVIRONMENT unset (defaults to
  # "production") and configure JWKS_URL + JWT_AUDIENCE.
  # ---------------------------------------------------------------------------

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
